<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Agent Relay walkthrough</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172334;font-family:'Segoe UI',sans-serif;width:1280px;height:720px;overflow:hidden}header{height:86px;padding:24px 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dae1ed}.brand{font-size:23px;font-weight:700;letter-spacing:-.6px}.badge{font-size:13px;letter-spacing:1.5px;color:#4a5c73;font-weight:600}.mark{display:inline-grid;place-items:center;background:#233a5a;color:white;width:36px;height:36px;border-radius:11px;margin-right:10px}main{height:538px;display:grid;grid-template-columns:440px 1fr;gap:32px;padding:40px 56px 20px}.kicker{font-size:14px;letter-spacing:2px;color:#345bd6;font-weight:700;margin-bottom:16px}h1{font-size:44px;line-height:1.12;letter-spacing:-1.4px;margin:0 0 22px}p{font-size:23px;line-height:1.45;color:#4c5c71;margin:0 0 18px}.small{font-size:17px;line-height:1.5}code{font-family:Consolas,monospace}pre{font-size:19px;line-height:1.7;background:#e6ecf7;border-radius:12px;padding:18px;white-space:pre-wrap}aside{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;min-width:0}.capture{width:100%;max-height:440px;object-fit:contain;filter:drop-shadow(0 12px 18px #233a5a18)}.phone{height:470px;width:auto;border:6px solid #233a5a;border-radius:22px}.stack{max-height:230px}.note{background:#e0f0e9;color:#235341;padding:14px 20px;border-radius:12px;font-size:19px;line-height:1.4;width:100%}.number{font-size:70px;font-weight:700;letter-spacing:-3px;color:#345bd6}.steps{display:flex;gap:8px;margin-top:24px}.steps span{height:4px;flex:1;background:#d7deea;border-radius:3px}.steps .on{background:#345bd6}footer{height:96px;background:#233a5a;color:#fff;padding:22px 56px;display:flex;gap:24px;align-items:center;font-size:23px;line-height:1.35}.chapter{font-size:13px;white-space:nowrap;color:#a8bfdc;letter-spacing:1px}.guide{display:block;padding-top:32px}.guide h1{font-size:37px;margin-bottom:8px}.guide>p{font-size:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}.card{background:white;border:1px solid #d9e0ec;border-radius:18px;padding:26px;min-height:306px}.card h2{font-size:25px;margin:12px 0}.card p{font-size:19px}.card b{color:#345bd6;font-size:14px;letter-spacing:1px}.card code{font-size:16px;color:#233a5a}.label{font-size:15px;color:#56677c;align-self:flex-start}
</style>
<header><div class="brand"><span class="mark">↗</span>Agent Relay</div><div class="badge">PRODUCT WALKTHROUGH · DEMO DATA</div></header>
<main id="main"></main><footer><span class="chapter" id="chapter"></span><span id="caption"></span></footer>
<script>
const scenes=[
 {tag:'LESS REPEATING. MORE CONTINUING.',title:'Your next session<br>starts here.',body:'Keep your coding work moving across sessions, tools and usage limits.',small:'For developers using Claude Code, Codex, or both.',image:'demo-mobile.png',phone:true,caption:'Agent Relay keeps the working context and next action close at hand.'},
 {tag:'01 / CHECK',title:'Know where you<br>can continue.',body:'Compare recorded account capacity before starting the next step.',small:'Here, Claude has 8% session capacity. Codex has 72% weekly capacity. These are different quota windows—not interchangeable budgets.',image:'demo-capacity.png',caption:'Read the window, freshness and reserve—not just the percentage.'},
 {tag:'02 / SAVE',title:'Save the context.<br>Verify the state.',body:'Record what changed, why it changed, what passed, and what remains.',code:'/handoff  →  /checkpoint\nCodex: $handoff → $checkpoint',image:'demo-checkpoint.png',caption:'A checkpoint links the next action to the repository state.'},
 {tag:'03 / RELEASE',title:'One writer.<br>One clear handoff.',body:'Stop the source session before releasing ownership.',small:'Relay checks participating workflows. It cannot stop another IDE or prevent independent edits.',image:'demo-release.png',caption:'The source must be stopped. A changed repository needs a fresh release.'},
 {tag:'04 / CONTINUE',title:'Claim the work.<br>Carry it forward.',body:'Choose the destination account, claim ownership, and copy the resume prompt.',small:'Open the destination coding tool yourself and verify the checkpoint before editing.',image:'demo-claim.png',second:'demo-resume.png',caption:'Relay prepares the handoff. It does not launch a model task or copy chat history.'},
 {tag:'05 / CHECK FROM YOUR PHONE',title:'Your workspace,<br>within reach.',body:'See quotas, workstreams and supported actions in a paired mobile browser.',small:'HTTPS and device pairing required. The host must stay awake and reachable. One owner, their devices.',image:'demo-mobile.png',phone:true,caption:'The same personal workspace, with a layout built for a small screen.'},
 {tag:'START SMALL',title:'Check. Save.<br>Continue.',body:'Start with handoffs and working rules. Add usage tracking and phone access when you need them.',code:'bash install.sh --tool both /path/to/your/project',note:'You keep control of the tools, reviews and final decisions.',caption:'See README.md for setup and docs/remote-access.md for paired phone access.'}
];
const query=new URLSearchParams(location.search), main=document.getElementById('main');
if(query.has('guide')){
 main.className='guide';main.innerHTML='<div class="kicker">THE WORKFLOW AT A GLANCE</div><h1>One workstream. A clear next step.</h1><p>For developers using Claude Code, Codex, or both.</p><div class="cards"><div class="card"><b>01 / CHECK</b><h2>Choose the next step</h2><p>Inspect quota windows and freshness. Use capacity as guidance for a bounded task.</p><code>usagectl usage status</code></div><div class="card"><b>02 / SAVE</b><h2>Keep the context</h2><p>Save decisions, changed files, verification results and what remains.</p><code>/handoff → /checkpoint<br>$handoff → $checkpoint</code></div><div class="card"><b>03 / CONTINUE</b><h2>Transfer deliberately</h2><p>Stop the source writer. Release, claim, then verify the checkpoint in the destination tool.</p><code>One owner at a time</code></div></div>';
 document.getElementById('chapter').textContent='AGENT RELAY';document.getElementById('caption').textContent='Personal workflow kit. Local state. Optional HTTPS phone access.';
}else{
 const i=Math.max(0,Math.min(6,Number(query.get('scene'))||0)),s=scenes[i];
 main.innerHTML='<section><div class="kicker">'+s.tag+'</div><h1>'+s.title+'</h1><p>'+s.body+'</p>'+(s.small?'<p class="small">'+s.small+'</p>':'')+(s.code?'<pre>'+s.code+'</pre>':'')+'<div class="steps">'+scenes.map((_,j)=>'<span class="'+(j<=i?'on':'')+'"></span>').join('')+'</div></section><aside>'+(s.image?'<img class="capture '+(s.phone?'phone':'')+(s.second?' stack':'')+'" src="../media/'+s.image+'" alt="Real dashboard UI with simulated demo data">':'<div class="number">↗</div>')+(s.second?'<img class="capture stack" src="../media/'+s.second+'" alt="Demo resume prompt">':'')+(s.note?'<div class="note">'+s.note+'</div>':'')+'</aside>';
 document.getElementById('chapter').textContent=String(i+1).padStart(2,'0')+' / 07';document.getElementById('caption').textContent=s.caption;
}
</script></html>
